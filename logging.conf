[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=standard

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandler

[handler_consoleHandler]
class=StreamHandler
level=%(loglevel)s
formatter=standard
args=(sys.stderr,)

[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=DEBUG
formatter=standard
args=('bojata.log', 'a', 1<<24, 5)

[formatter_standard]
format=[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s
